
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Registration | CampusBite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Inter, sans-serif;
      color: #fff;
      background:
        linear-gradient(rgba(15,39,25,.65), rgba(15,39,25,.82)),
        url("{{ url_for('static', filename='campusbite-hero.png') }}")
        center / cover fixed;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 34px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.23);
      border-radius: 24px;
      background: rgba(24,59,41,.68);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 65px rgba(0,0,0,.25);
    }

    .logo {
      width: 65px;
      height: 65px;
      padding: 4px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
      margin-bottom: 12px;
    }

    .brand {
      margin: 0;
      color: #fff;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .brand span { color: #e6c85c; }

    .subtitle {
      margin: 8px 0 28px;
      color: rgba(255,255,255,.75);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .intro {
      margin: 0 0 24px;
      color: rgba(255,255,255,.72);
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 17px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      color: #fff;
      font: inherit;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 10px;
      background: rgba(0,0,0,.16);
      outline: none;
    }

    input:focus { border-color: #e6c85c; }

    input::placeholder { color: rgba(255,255,255,.52); }

    .submit {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      border: 0;
      border-radius: 10px;
      color: #203d2b;
      background: #e6c85c;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .submit:hover { background: #f0d77b; }

    .message {
      padding: 11px;
      margin-bottom: 16px;
      border-radius: 9px;
      font-size: 13px;
      text-align: left;
    }

    .error {
      background: rgba(180,30,30,.35);
      border: 1px solid rgba(255,255,255,.2);
    }

    .success {
      background: rgba(30,130,65,.35);
      border: 1px solid rgba(255,255,255,.2);
    }

    .back {
      display: inline-block;
      margin-top: 23px;
      color: #fff;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover { color: #e6c85c; }

    @media (max-width: 460px) {
      .card { padding: 27px 21px; }
    }
  </style>
</head>

<body>
  <main class="card">

    <img class="logo"
         src="{{ url_for('static', filename='logo.png') }}"
         alt="Srinivas University logo">

    <h1 class="brand">Campus<span>Bite</span></h1>
    <p class="subtitle">Srinivas University</p>

    <p class="intro">
     Create Staff Account
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="message {{ 'error' if category == 'error' else 'success' }}"
             role="alert">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('staff_register') }}">
      <div class="field">
        <label for="username">Staff Username</label>
        <input id="username" name="username" type="text"
               placeholder="Choose a username"
               autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               placeholder="At least 12 characters"
               minlength="12" autocomplete="new-password" required>
      </div>

      <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password"
               type="password" placeholder="Re-enter password"
               minlength="12" autocomplete="new-password" required>
      </div>

      <button class="submit" type="submit">Create Staff Account</button>
    </form>

    <a class="back" href="{{ url_for('staff_dashboard') }}">
      &larr; Back to Dashboard
    </a>

  </main>
</body>
</html>
